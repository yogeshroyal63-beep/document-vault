name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: document_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d document_vault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vault:vault@localhost:5432/document_vault?schema=public
      TEST_DATABASE_URL: postgresql://vault:vault@localhost:5432/document_vault_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=vault psql -h localhost -U vault -d document_vault -c "CREATE DATABASE document_vault_test;"

      - name: Apply migrations + generate client (dev DB)
        run: bun run gendb

      - name: Apply migrations (test DB)
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration
